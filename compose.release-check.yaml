# Local verification override only. Always use an isolated Compose project and .env.release-check.
services:
  app:
    environment:
      APP_URL: http://localhost:8082
      SESSION_SECURE_COOKIE: 'false'
  web:
    environment:
      APP_DOMAIN: ':80'
    ports: !override
      - '127.0.0.1:8082:80'
