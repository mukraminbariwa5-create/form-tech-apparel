<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    # Render's health check may use an internal host name that Laravel's trusted-host rule rejects,
    # so Apache answers /up itself (the container is healthy once Apache is serving).
    Alias /up /var/www/health/up.txt
    <Directory /var/www/health>
        Require all granted
    </Directory>
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Render ends HTTPS at its proxy; tell Laravel the visitor's connection was secure.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
    Header always set X-Frame-Options SAMEORIGIN
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
