; Cache compiled PHP across built-in-server requests on Windows bind mounts.
; Source changes remain visible through timestamp validation (up to 2 seconds).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=disable
opcache.jit_buffer_size=0
